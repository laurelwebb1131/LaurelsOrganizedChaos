name: Deploy Organized Chaos Planner to GitHub Pages

on:
  push:
    branches:
      - planner-v1
      - laurelwebb1131-build-hearthwise-dashboard
    paths:
      - 'public/planner/**'
      - '.github/workflows/planner-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: organized-chaos-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate planner
        run: node scripts/check-planner.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload planner
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/planner

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
