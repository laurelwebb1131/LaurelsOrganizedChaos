<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#100d14" />
  <meta name="description" content="Laurel's Organized Chaos Planner" />
  <title>Laurel's Organized Chaos Planner</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Planner navigation">
      <div class="brand-mini">
        <div class="brand-mark">LOC</div>
        <div>
          <strong>Laurel's</strong>
          <span>Organized Chaos</span>
        </div>
      </div>
      <nav id="main-nav"></nav>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="ghost-btn" type="button">Quieter Chaos</button>
        <small>Local-first • Free • Yours</small>
      </div>
    </aside>
    <header class="mobile-header">
      <button class="icon-btn" id="mobile-menu" aria-label="Open menu" type="button">☰</button>
      <div class="mobile-title">Laurel's Organized Chaos</div>
      <button class="icon-btn" id="quick-add-mobile" aria-label="Quick add task" type="button">＋</button>
    </header>
    <main id="main-content" tabindex="-1"></main>
  </div>
  <button class="floating-add" id="floating-add" type="button" aria-label="Quick add task">＋</button>
  <div class="modal-backdrop hidden" id="modal-backdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Add item</h2>
        <button class="icon-btn" id="modal-close" type="button" aria-label="Close">✕</button>
      </div>
      <div id="modal-body"></div>
    </section>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js"></script>
</body>
</html>
