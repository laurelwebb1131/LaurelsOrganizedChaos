[package]
name = "hearthwise"
version = "0.1.0"
description = "Hearthwise mythic life world"
authors = ["Laurel Webb"]
license = "MIT"
repository = "https://github.com/laurelwebb1131/LaurelsOrganizedChaos"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6" }
tauri-plugin-log = "2"
